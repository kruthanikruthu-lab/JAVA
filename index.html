<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow | Chinmay C</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header><h1>TaskFlow</h1></header><main><section><h2>My to-do list</h2><form id="form"><label for="task">New task</label><input id="task" required maxlength="150" placeholder="What needs doing?"><button>Add task</button></form><p id="status" role="status" aria-live="polite"></p><div class="flex"><button data-filter="all" aria-pressed="true">All</button><button data-filter="active">Active</button><button data-filter="completed">Completed</button></div><ul id="list"></ul><p id="empty">No tasks found.</p><button id="clear">Clear completed</button></section></main><footer>Chinmay C · Local storage task manager</footer></body></html>
